<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <title>Sign by Sign — interactive prototype</title>
  <style>
    :root {
      --ink: #18302e;
      --muted: #647570;
      --line: #e0e8e2;
      --paper: #f7f8f3;
      --white: #fff;
      --teal: #176d65;
      --teal-dark: #104e49;
      --teal-soft: #e5f3ed;
      --orange: #a95724;
      --orange-soft: #fff0df;
      --shadow: 0 26px 70px rgba(19, 54, 48, .2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Inter, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink); background: #e9efea; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .48; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #f7af65; outline-offset: 3px; }
    .desktop-stage { min-height: 100vh; display: grid; grid-template-columns: minmax(280px, 420px) 390px; align-items: center; justify-content: center; gap: min(8vw, 110px); padding: 32px; }
    .presentation { align-self: center; max-width: 420px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--teal); font-size: 12px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow:before { content: ""; width: 22px; height: 2px; background: currentColor; }
    .presentation h1 { font-size: clamp(44px, 5.2vw, 70px); line-height: .98; letter-spacing: -.065em; margin: 24px 0 20px; font-weight: 800; }
    .presentation h1 em { font-style: normal; color: var(--teal); }
    .presentation p { font-size: 17px; line-height: 1.65; color: #556c66; max-width: 370px; }
    .demo-note { margin-top: 42px; border-top: 1px solid #ccdad1; padding-top: 22px; display: grid; gap: 12px; color: #47645c; font-size: 14px; }
    .demo-note strong { color: var(--ink); }
    .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 26px; padding: 0 7px; border-radius: 6px; background: white; border: 1px solid #cbdad1; box-shadow: 0 2px 0 #cbdad1; color: var(--ink); font-size: 12px; font-weight: 700; }
    .phone-frame { width: 390px; height: min(844px, calc(100vh - 40px)); min-height: 610px; border: 9px solid #1d3530; border-radius: 44px; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; position: relative; }
    .phone-frame:after { content: ""; position: absolute; width: 95px; height: 5px; border-radius: 20px; background: #18302e; bottom: 7px; left: 50%; transform: translateX(-50%); z-index: 30; opacity: .55; }
    #app { height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--paper); }
    .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .screen { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .language-bar { flex: 0 0 auto; min-height: 45px; display: flex; align-items: center; justify-content: flex-end; padding: 5px 18px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .language-toggle { min-height: 44px; border: 1px solid #d4e0d7; background: white; border-radius: 999px; color: var(--teal); padding: 0 11px; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 850; }
    .language-toggle svg { width: 16px; height: 16px; }
    .language-setup-screen { overflow-y: auto; }
    .language-picker-image { flex: 0 0 auto; height: 27%; min-height: 140px; overflow: hidden; position: relative; background: #dce9df; }
    .language-picker-image img { width: 100%; height: 100%; object-fit: cover; }
    .language-picker-image:after { content: ""; position: absolute; inset: 35% 0 0; background: linear-gradient(transparent, rgba(13,38,34,.34)); }
    .language-picker-copy { flex: 0 0 auto; padding: 22px 24px 8px; }
    .language-picker-copy h1 { margin: 9px 0 10px; font-size: 30px; line-height: 1.1; letter-spacing: -.05em; }
    .language-picker-copy p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 13px; }
    .language-options { display: grid; gap: 9px; padding: 12px 22px 20px; }
    .language-option { width: 100%; min-height: 57px; border: 1.5px solid var(--line); border-radius: 16px; background: white; color: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 17px; font-size: 15px; font-weight: 800; text-align: left; }
    .language-option.selected { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
    .language-option .radio { width: 19px; height: 19px; border: 2px solid #aebfb5; border-radius: 50%; display: grid; place-items: center; }
    .language-option.selected .radio { border-color: var(--teal); }
    .language-option.selected .radio:after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); }
    .language-picker-footer { flex: 0 0 auto; margin-top: auto; padding: 10px 22px max(20px, env(safe-area-inset-bottom)); }
    .language-menu { width: 100%; max-width: 330px; max-height: 100%; overflow-y: auto; background: white; border-radius: 24px; padding: 22px; box-shadow: 0 25px 60px #0c2a2140; }
    .language-menu h2 { font-size: 22px; letter-spacing: -.04em; margin: 0 0 8px; }
    .language-menu p { color: var(--muted); font-size: 13px; margin: 0 0 15px; }
    .language-menu .language-options { padding: 0; }
    .language-menu-close { margin-top: 12px; }
    .screen-scroll { overflow-y: auto; min-height: 0; flex: 1; overscroll-behavior: contain; scrollbar-width: thin; }
    .pad { padding-left: 22px; padding-right: 22px; }
    .screen-header { flex: 0 0 auto; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; background: var(--paper); }
    .header-title { font-size: 20px; font-weight: 800; letter-spacing: -.035em; }
    .small-caps { font-size: 11px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
    .icon-btn { border: 0; background: rgba(255,255,255,.85); width: 42px; height: 42px; border-radius: 15px; display: inline-grid; place-items: center; color: var(--ink); flex: 0 0 auto; }
    .icon-btn:hover { background: #e9f1eb; }
    .icon-btn svg, .nav-item svg, .inline-icon svg { width: 20px; height: 20px; display: block; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 18px; letter-spacing: -.035em; }
    .brand-mark { width: 31px; height: 31px; background: var(--teal); color: white; border-radius: 11px; display: grid; place-items: center; font-size: 17px; transform: rotate(-7deg); }
    .main-nav { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; background: white; border-top: 1px solid var(--line); padding: 7px 24px max(9px, env(safe-area-inset-bottom)); gap: 8px; }
    .nav-item { min-height: 52px; border: 0; border-radius: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; color: #82928d; background: transparent; font-size: 13px; font-weight: 750; }
    .nav-item.active { color: var(--teal); background: var(--teal-soft); }
    .home-hero { margin: 5px 16px 24px; padding: 25px 22px 27px; border-radius: 28px; background: #e3eee6; position: relative; overflow: hidden; }
    .home-hero:after { content: ""; width: 180px; height: 180px; position: absolute; border-radius: 50%; background: rgba(255,255,255,.42); right: -70px; top: -80px; }
    .home-hero .small-caps { color: var(--teal); position: relative; z-index: 1; }
    .home-hero h1 { margin: 11px 0 10px; font-size: 32px; line-height: 1.08; letter-spacing: -.055em; position: relative; z-index: 1; }
    .home-hero p { margin: 0; font-size: 14px; line-height: 1.5; color: #52716a; max-width: 250px; position: relative; z-index: 1; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 13px; }
    .section-head h2 { font-size: 18px; letter-spacing: -.03em; margin: 0; }
    .section-head span { font-size: 12px; color: var(--muted); }
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .category-card { text-align: left; min-height: 81px; padding: 13px 13px 11px; border-radius: 17px; border: 1.5px solid var(--line); background: white; color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
    .category-card.wide { grid-column: 1 / -1; min-height: 67px; flex-direction: row; align-items: center; }
    .category-card.selected { border-color: var(--teal); background: #edf7f0; box-shadow: inset 0 0 0 1px var(--teal); }
    .category-card strong { font-size: 13px; line-height: 1.18; }
    .category-card small { color: var(--muted); font-weight: 650; font-size: 11px; }
    .category-card.selected small { color: var(--teal); }
    .count-pill { font-size: 11px; font-weight: 800; color: var(--teal); background: white; padding: 5px 8px; border-radius: 99px; }
    .bottom-cta { margin: 20px 22px 22px; flex: 0 0 auto; }
    .primary-btn { width: 100%; min-height: 54px; border: 0; border-radius: 17px; background: var(--teal); color: white; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 0 8px 17px rgba(23,109,101,.18); }
    .primary-btn:hover { background: var(--teal-dark); }
    .secondary-btn { width: 100%; min-height: 51px; border: 1px solid #cbdad2; border-radius: 16px; background: white; color: var(--ink); font-size: 14px; font-weight: 780; }
    .text-btn { border: 0; background: transparent; color: var(--teal); font-size: 14px; font-weight: 800; padding: 10px 4px; }
    .resume { margin: 0 22px 22px; padding: 13px 14px; border: 1px solid #d5e6dc; border-radius: 18px; background: #fff; display: flex; gap: 12px; align-items: center; }
    .resume-icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); flex: 0 0 auto; }
    .resume-info { min-width: 0; flex: 1; }
    .resume-info strong { display: block; font-size: 13px; }
    .resume-info small { color: var(--muted); font-size: 11px; }
    .resume button { border: 0; background: var(--teal); color: white; padding: 10px 11px; font-size: 11px; font-weight: 800; border-radius: 11px; }
    .empty-inline { padding: 25px 18px; border-radius: 19px; background: white; border: 1px solid var(--line); text-align: center; }
    .empty-inline strong { display: block; font-size: 15px; }
    .empty-inline p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 7px 0 0; }
    .onboard-image { height: 48%; min-height: 260px; background: #dce9df; overflow: hidden; position: relative; }
    .onboard-image img { width: 100%; height: 100%; object-fit: cover; }
    .onboard-image:after { content: ""; position: absolute; inset: 50% 0 0; background: linear-gradient(transparent, rgba(15,43,38,.36)); }
    .onboard-step { position: absolute; top: 22px; left: 22px; z-index: 2; border-radius: 100px; background: rgba(255,255,255,.92); padding: 8px 11px; color: var(--teal); font-size: 11px; font-weight: 850; letter-spacing: .08em; }
    .onboard-skip { position: absolute; top: 18px; right: 18px; z-index: 2; border: 0; background: rgba(255,255,255,.92); color: var(--ink); padding: 10px 13px; border-radius: 100px; font-size: 12px; font-weight: 800; }
    .onboard-copy { padding: 29px 25px 13px; flex: 1; }
    .onboard-copy h1 { margin: 13px 0 14px; font-size: 34px; line-height: 1.07; letter-spacing: -.055em; }
    .onboard-copy p { color: #60746e; line-height: 1.55; font-size: 15px; margin: 0; }
    .dots { display: flex; gap: 6px; margin-top: 25px; }
    .dots i { width: 7px; height: 7px; background: #c5d3ca; border-radius: 50%; }
    .dots i.active { width: 22px; border-radius: 8px; background: var(--teal); }
    .onboard-footer { padding: 12px 22px 25px; }
    .study-header { padding: 12px 17px 9px; min-height: 62px; display: grid; grid-template-columns: 42px 1fr 52px; align-items: center; text-align: center; }
    .study-header span { font-size: 13px; font-weight: 850; }
    .undo-btn { background: transparent; border: 0; font-size: 12px; font-weight: 800; color: var(--teal); min-height: 42px; }
    .progress-track { margin: 0 22px 14px; height: 5px; border-radius: 20px; background: #e0eae3; overflow: hidden; flex: 0 0 auto; }
    .progress-track span { display: block; height: 100%; background: var(--teal); border-radius: inherit; transition: width .25s; }
    .study-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 18px 18px; overscroll-behavior: contain; }
    .swipe-surface { position: relative; background: white; border: 1px solid var(--line); border-radius: 25px; padding: 12px; box-shadow: 0 12px 28px rgba(34,67,51,.08); touch-action: pan-y; user-select: none; transition: transform .2s ease; }
    .swipe-surface.dragging { transition: none; }
    .study-category { padding: 6px 6px 11px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 850; color: var(--teal); }
    .photo-btn { width: 100%; padding: 0; border: 0; background: #e5ece8; display: block; position: relative; border-radius: 17px; overflow: hidden; aspect-ratio: 1.52; }
    .photo-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-label { position: absolute; bottom: 9px; left: 9px; z-index: 1; border-radius: 6px; background: rgba(18,39,35,.68); color: white; font-size: 9px; padding: 5px 7px; letter-spacing: .1em; font-weight: 800; }
    .photo-expand { position: absolute; top: 9px; right: 9px; background: rgba(255,255,255,.9); color: var(--ink); width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
    .photo-expand svg { width: 17px; height: 17px; }
    .image-error { display: none; height: 100%; padding: 35px 15px; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
    .image-error strong { font-size: 15px; }
    .image-error small { font-size: 12px; color: var(--muted); }
    .photo-btn.broken img, .photo-btn.broken .photo-label, .photo-btn.broken .photo-expand { display: none; }
    .photo-btn.broken .image-error { display: flex; }
    .question { text-align: center; font-size: 17px; font-weight: 780; margin: 18px 7px 13px; letter-spacing: -.02em; }
    .meaning-btn { min-height: 44px; border: 1px solid #c7ded3; background: #eff8f1; color: var(--teal); padding: 0 17px; border-radius: 14px; font-size: 13px; font-weight: 850; display: block; margin: 0 auto 12px; }
    .answer { margin: 15px 4px 3px; border-top: 1px solid var(--line); padding: 16px 3px 3px; }
    .answer-korean { font-size: 27px; font-weight: 850; letter-spacing: -.04em; margin-bottom: 4px; word-break: keep-all; }
    .answer-meaning { font-size: 20px; font-weight: 800; color: var(--teal); letter-spacing: -.03em; }
    .answer p { font-size: 13px; line-height: 1.53; color: #5f726c; margin: 10px 0 0; }
    .keywords { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .keywords span { border-radius: 9px; padding: 7px 9px; background: #f2f5f1; font-size: 11px; color: #4c635c; }
    .swipe-stamp { position: absolute; z-index: 3; top: 57px; padding: 8px 11px; border: 3px solid currentColor; border-radius: 9px; font-size: 18px; font-weight: 900; letter-spacing: .05em; opacity: 0; pointer-events: none; transform: rotate(-9deg); background: rgba(255,255,255,.9); }
    .swipe-stamp.left { left: 23px; color: var(--orange); }
    .swipe-stamp.right { right: 23px; color: var(--teal); transform: rotate(9deg); }
    .study-actions { background: var(--paper); padding: 13px 18px max(18px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 9px; flex: 0 0 auto; }
    .choice-btn { border: 0; border-radius: 17px; min-height: 56px; padding: 5px 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; line-height: 1.15; font-weight: 850; }
    .choice-btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .choice-btn.left { background: var(--orange-soft); color: var(--orange); }
    .choice-btn.right { background: var(--teal); color: white; }
    /* Immersive, photo-first study deck. The portrait assets keep every Hangul sign legible. */
    #app.is-immersive { background: #10231f; }
    .is-immersive .language-bar { position: absolute; inset: 0 0 auto; z-index: 10; border: 0; background: transparent; padding: max(6px, env(safe-area-inset-top)) 18px 6px; }
    .is-immersive .language-toggle { min-height: 38px; border-color: rgba(255,255,255,.36); background: rgba(18,34,30,.56); color: white; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .is-immersive .app-content { width: 100%; }
    .study-page { position: relative; isolation: isolate; background: #10231f; color: white; overflow: hidden; }
    .study-deck-next, .study-scroll, .study-page .swipe-surface { position: absolute; inset: 0; }
    .study-deck-next { z-index: 0; overflow: hidden; background: linear-gradient(145deg,#2e7369,#142f2b); }
    .study-deck-next img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .study-deck-next .next-finish { position: absolute; inset: 0; display: grid; place-items: center; color: white; font-size: 26px; font-weight: 850; text-align: center; }
    .study-scroll { z-index: 1; padding: 0; overflow: hidden; touch-action: pan-y; }
    .study-page .swipe-surface { border: 0; border-radius: 0; padding: 0; box-shadow: none; background: #19342d; overflow: hidden; touch-action: pan-y; }
    .study-page .swipe-surface:after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg,rgba(9,25,23,.58) 0%,transparent 24%,transparent 47%,rgba(8,23,22,.10) 67%,rgba(8,23,22,.78) 100%); }
    .study-page .study-photo { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; aspect-ratio: auto; background: #18322d; z-index: 0; }
    .study-page .study-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .study-page .study-photo .photo-label { display: none; }
    .study-page .study-photo .photo-expand { top: calc(170px + env(safe-area-inset-top)); right: 18px; width: 42px; height: 42px; border-radius: 14px; background: rgba(19,39,34,.60); color: white; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .study-page .study-photo .photo-expand svg { width: 19px; height: 19px; }
    .study-page .study-photo.broken { background: #dce9df; color: var(--ink); }
    .study-page .study-header { position: absolute; z-index: 5; top: calc(54px + env(safe-area-inset-top)); left: 0; right: 0; min-height: 50px; padding: 4px 18px; grid-template-columns: 44px 1fr 72px; color: white; }
    .study-page .study-header .icon-btn { width: 44px; height: 44px; background: rgba(14,30,27,.45); color: white; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .study-page .study-header span { font-size: 14px; text-shadow: 0 1px 5px #142b24aa; }
    .study-page .undo-btn { color: white; background: rgba(14,30,27,.45); border-radius: 13px; padding: 0 8px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .study-page .undo-btn:disabled { opacity: .55; }
    .study-page .progress-track { position: absolute; z-index: 5; top: calc(112px + env(safe-area-inset-top)); left: 22px; right: 22px; margin: 0; height: 4px; background: rgba(255,255,255,.38); }
    .study-page .progress-track span { background: white; box-shadow: 0 0 10px rgba(255,255,255,.5); }
    .study-page .study-category { position: absolute; z-index: 2; top: calc(129px + env(safe-area-inset-top)); left: 17px; right: 17px; padding: 0; color: white; gap: 8px; text-shadow: 0 1px 5px #0d2520aa; }
    .study-page .study-category span { display: inline-flex; align-items: center; min-height: 29px; padding: 0 10px; border: 1px solid rgba(255,255,255,.34); border-radius: 99px; background: rgba(13,33,29,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .study-page .study-reveal { position: absolute; z-index: 2; left: 24px; right: 24px; bottom: 150px; text-align: center; }
    .study-page .question { margin: 0 0 14px; color: white; font-size: 20px; font-weight: 850; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
    .study-page .meaning-btn { min-height: 50px; margin: 0 auto; border: 1px solid rgba(255,255,255,.78); border-radius: 99px; padding: 0 23px; color: var(--ink); background: rgba(255,255,255,.94); box-shadow: 0 7px 25px #091e1b3b; font-size: 14px; }
    .study-page .answer { position: absolute; z-index: 2; left: 18px; right: 18px; bottom: 116px; max-height: min(35%, 290px); overflow-y: auto; margin: 0; border: 1px solid rgba(255,255,255,.8); border-radius: 25px; padding: 19px 20px 17px; color: var(--ink); background: rgba(251,253,248,.94); box-shadow: 0 18px 45px rgba(0,0,0,.19); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .study-page .answer-korean { font-size: 25px; }
    .study-page .answer-meaning { font-size: 19px; }
    .study-page .answer p { color: #4c635d; }
    .study-page .swipe-stamp { top: 30%; font-size: 24px; border-radius: 13px; padding: 10px 14px; background: rgba(255,255,255,.94); }
    .study-page .study-actions { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 10px 18px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(transparent,rgba(9,28,25,.48) 18%,rgba(9,28,25,.82)); gap: 12px; }
    .study-page .choice-btn { min-height: 64px; border-radius: 21px; font-size: 14px; box-shadow: 0 9px 25px rgba(0,0,0,.18); }
    .study-page .choice-btn.left { color: #783d19; background: #fff5e8; }
    .study-page .choice-btn.right { background: #e6f7ed; color: #0d594a; }
    .study-page .choice-btn svg { width: 21px; height: 21px; }
    @media (max-height: 700px) {
      .study-page .study-photo .photo-expand { top: calc(154px + env(safe-area-inset-top)); }
      .study-page .study-reveal { bottom: 134px; }
      .study-page .answer { bottom: 104px; max-height: 38%; padding: 13px 16px; }
      .study-page .answer-korean { font-size: 22px; }
      .study-page .study-actions { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .study-page .choice-btn { min-height: 54px; }
    }

            '" alt=""><span style="flex:1;min-width:0;"><small>' + escapeHtml(categoryLabel(c.category)) +
            '</small><strong lang="ko">' + escapeHtml(c.korean) + '</strong><small>' + t("tapDetails") + '</small></span>' +
            '<span class="inline-icon" aria-hidden="true">' + icon("arrow") + '</span></button>';
        }).join("");
        return '<div class="screen"><header class="screen-header"><strong class="header-title">' + t("review") + '</strong>' + settingsButton() + '</header>' +
          '<div class="screen-scroll">' + resumeBanner() + '<div class="review-intro"><h1>' + t("reviewHero") + '</h1><p>' + t("reviewDesc") + '</p></div>' +
          (list.length ? '<div class="review-count"><span>' + t("signsCount", { n: list.length }) + '</span><span>' + t("newestFirst") + '</span></div>' +
            '<div class="pad" style="margin-bottom:20px;"><button class="primary-btn" data-action="start-review">' + t("startReviewing") + ' ' + icon("arrow") + '</button></div>' +
            '<div class="review-list">' + rows + '</div>' :
            '<div class="review-empty"><div class="empty-symbol">✓</div><h2>' + t("nothingReview") + '</h2><p>' + t("swipeLeftAppears") + '</p>' +
            '<button class="secondary-btn" data-action="nav-home" style="margin-top:15px;">' + t("startLearning") + '</button></div>') +
          '</div>' + mainNav("review") + '</div>';
      }
      function renderDetail() {
        var card = findCard(detailId);
        if (!card) { screen = "review"; return renderReview(); }
        return '<div class="screen"><header class="screen-header"><button class="icon-btn" data-action="detail-back" aria-label="' + escapeHtml(t("backReview")) + '">' +
          icon("back") + '</button><strong class="header-title">' + t("signDetails") + '</strong><span style="width:42px;"></span></header>' +
          '<div class="screen-scroll"><div class="detail-body"><div class="small-caps">' + escapeHtml(categoryLabel(card.category)) + '</div>' +
          photoMarkup(card, "") +
          (detailRevealed ? answerMarkup(card) : '<div class="question">' + t("question") + '</div><button class="meaning-btn" data-action="detail-reveal">' + t("showMeaning") + '</button>') +
          '</div></div><footer class="detail-footer"><button class="secondary-btn" data-action="detail-back">' + t("backReview") + '</button></footer></div>';
      }
      function renderSettings() {
        return '<div class="screen"><header class="screen-header"><button class="icon-btn" data-action="settings-back" aria-label="' + escapeHtml(t("back")) + '">' +
          icon("back") + '</button><strong class="header-title">' + t("settings") + '</strong><span style="width:42px;"></span></header>' +
          '<div class="screen-scroll"><div class="settings-list">' +
          '<button class="settings-row" data-action="how"><span>' + t("howItWorks") + '</span>' + icon("arrow") + '</button>' +
          '<button class="settings-row" data-action="reset"><span>' + t("resetProgress") + '</span>' + icon("arrow") + '</button>' +
          '<button class="settings-row" data-action="about"><span>' + t("about") + '</span>' + icon("arrow") + '</button></div>' +
          '<p class="settings-hint">' + t("settingsHint") + '</p>' +
          '</div></div>';
      }
      function renderModal() {
        if (!modal) return "";
        return '<div class="modal-layer" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="' + escapeHtml(modal.title) +
          '"><h2>' + escapeHtml(modal.title) + '</h2><p>' + escapeHtml(modal.body) + '</p><div class="dialog-actions">' +
          '<button class="cancel" data-action="modal-cancel">' + escapeHtml(modal.cancel || t("cancel")) + '</button>' +
          '<button class="confirm ' + (modal.danger ? "danger" : "") + '" data-action="modal-confirm">' + escapeHtml(modal.confirm || t("continue")) +
          '</button></div></div></div>';
      }
      function renderZoom() {
        if (!zoomCard) return "";
        return '<div class="zoom-layer" role="dialog" aria-modal="true" aria-label="' + escapeHtml(t("enlargedPhoto")) + '">' +
          '<div class="zoom-top"><span>' + t("signPhotoIllustrative") + '</span><button data-action="zoom-close" aria-label="' + escapeHtml(t("closePhoto")) + '">×</button></div>' +
          '<div class="zoom-viewport" id="zoomViewport"><img id="zoomImage" src="' + escapeHtml(zoomCard.image) + '" alt="' + escapeHtml(t("enlargedPhoto")) + '" draggable="false"></div>' +
          '<div class="zoom-controls"><button data-action="zoom-out" aria-label="' + escapeHtml(t("zoomOut")) + '">−</button><span>' + t("pinchHint") + '</span>' +
          '<button data-action="zoom-in" aria-label="' + escapeHtml(t("zoomIn")) + '">+</button></div></div>';
      }
      function render() {
        var body = screen === "language-setup" ? renderLanguageSetup() :
          screen === "onboarding" ? renderOnboarding() :
          screen === "home" ? renderHome() :
          screen === "study" ? renderStudy() :
          screen === "summary" ? renderSummary() :
          screen === "review" ? renderReview() :
          screen === "detail" ? renderDetail() : renderSettings();
        app.className = screen === "study" ? "is-immersive" : "";
        app.innerHTML = (screen === "language-setup" ? "" : renderLanguageBar()) +
          '<div class="app-content">' + body + '</div>' + renderModal() + renderLanguageMenu() + renderZoom();
        ["desktopEyebrow", "desktopTitle", "desktopBody", "desktopTry", "desktopSwipe", "desktopSpace", "desktopSample"].forEach(function (id) {
          var element = document.getElementById(id);
          if (element) element.innerHTML = t(id);
        });
        attachSwipe();
        attachZoom();
        if (document.documentElement) document.documentElement.lang = state.language;
        document.title = "Sign by Sign — " + (screen === "study" ? t("learn") : screen === "review" ? t("review") : screen === "settings" ? t("settings") : t("language"));
      }
      function choose(choice) {
        if (choiceLocked) return;
        if (!state.activeSession || state.activeSession.phase !== "in_progress") return;
        var surface = document.getElementById("swipeSurface");
        var reducedMotion = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (surface && !reducedMotion) {
          applyChoice(choice, true);
          choiceLocked = true;
          surface.classList.remove("dragging");
          surface.style.transition = "transform .21s ease-in, opacity .21s ease-in";
          surface.style.transform = "translateX(" + (choice === "left" ? "-440px" : "440px") + ") rotate(" + (choice === "left" ? "-14deg" : "14deg") + ")";
          surface.style.opacity = "0";
          window.setTimeout(function () { choiceLocked = false; render(); }, 210);
          return;
        }
        applyChoice(choice, false);
      }
      function applyChoice(choice, deferRender) {
        var s = state.activeSession;
        if (!s || s.phase !== "in_progress") return;
        var card = findCard(s.cardIds[s.index]);
        if (!card) return;
        var prior = state.progress[card.id] ? JSON.parse(JSON.stringify(state.progress[card.id])) : null;
        s.undo = { id: card.id, prior: prior, index: s.index, revealed: !!s.revealed, counts: { left: s.counts.left, right: s.counts.right } };
        var oldPractice = prior && prior.practiceChoiceCount || 0;
        state.progress[card.id] = { status: choice === "left" ? "practice" : "got_it", lastChoiceAt: Date.now(), practiceChoiceCount: oldPractice + (choice === "left" ? 1 : 0) };
        s.counts[choice]++;
        s.index++;
        s.revealed = false;
        if (s.index >= s.cardIds.length) { s.phase = "results_pending"; screen = "summary"; }
        save();
        if (!deferRender) render();
      }
      function undo() {
        var s = state.activeSession;
        if (!s || !s.undo) return;
        var u = s.undo;
        if (u.prior === null) delete state.progress[u.id]; else state.progress[u.id] = u.prior;
        s.index = u.index;
        s.revealed = u.revealed;
        s.counts = u.counts;
        s.phase = "in_progress";
        s.undo = null;
        screen = "study";
        save();
        render();
      }
      function startLearn(category) {
        var pool = cards.filter(function (c) { return (category === "all" || c.category === category) && !state.progress[c.id]; });
        pool.sort(function (a, b) { return a.difficulty - b.difficulty || (a.id < b.id ? -1 : 1); });
        var chosen = pool.slice(0, 10);
        if (!chosen.length) { screen = "home"; render(); return; }
        state.activeSession = { sessionId: "learn-" + Date.now(), mode: "learn", category: category, phase: "in_progress", cardIds: chosen.map(function (c) { return c.id; }), index: 0, revealed: false, counts: { left: 0, right: 0 }, undo: null };
        save(); screen = "study"; render();
      }
      function startReview() {
        var chosen = reviewCards().slice(0, 10);
        if (!chosen.length) { screen = "review"; render(); return; }
        state.activeSession = { sessionId: "review-" + Date.now(), mode: "review", category: "all", phase: "in_progress", cardIds: chosen.map(function (c) { return c.id; }), index: 0, revealed: false, counts: { left: 0, right: 0 }, undo: null };
        save(); screen = "study"; render();
      }
      function askStart(mode) {
        var run = function () { if (mode === "learn") startLearn(state.selectedCategory); else startReview(); };
        if (!state.activeSession) { run(); return; }
        modal = { title: t("newSessionTitle"), body: t("newSessionBody"), confirm: t("startNew"), onConfirm: function () { state.activeSession = null; save(); run(); } };
        render();
      }
      function completeOnboarding() {
        state.onboarded = true; save();
        screen = onboardReturn; onboardStep = 0; render();
      }
      function leaveSummary(destination) {
        var selected = state.selectedCategory;
        state.activeSession = null; save();
        if (destination === "review-session") startReview();
        else if (destination === "learn-session") startLearn(selected);
        else { screen = destination; render(); }
      }
      function openZoom(id) {
        if (Date.now() < suppressZoomUntil) return;
        zoomCard = findCard(id); if (!zoomCard) return;
        zoomScale = 1; zoomX = 0; zoomY = 0; render();
      }
      function closeZoom() { zoomCard = null; render(); }
      function updateZoom() {
        var img = document.getElementById("zoomImage");
        if (img) img.style.transform = "translate(" + zoomX + "px," + zoomY + "px) scale(" + zoomScale + ")";
      }
      function attachSwipe() {
        var surface = document.getElementById("swipeSurface");
        if (!surface) return;
        var drag = null;
        surface.addEventListener("pointerdown", function (e) {
          if (e.target.closest("button") && !e.target.closest(".photo-btn")) return;
          drag = { x: e.clientX, y: e.clientY, t: performance.now(), active: false };
        });
        surface.addEventListener("pointermove", function (e) {
          if (!drag) return;
          var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
          if (!drag.active && Math.abs(dx) > 10 && Math.abs(dx) >= Math.abs(dy) * 1.25) {
            drag.active = true; surface.classList.add("dragging");
            try { surface.setPointerCapture(e.pointerId); } catch (_) {}
          }
          if (!drag.active) return;
          surface.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 26) + "deg)";
          var strength = Math.min(1, Math.abs(dx) / 80);
          document.getElementById("stampLeft").style.opacity = dx < 0 ? strength : 0;
          document.getElementById("stampRight").style.opacity = dx > 0 ? strength : 0;
        });
        function finish(e) {
          if (!drag) return;
          var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
          var elapsed = Math.max(1, performance.now() - drag.t);
          var speed = Math.abs(dx) / elapsed * 1000;
          var shouldChoose = drag.active && Math.abs(dx) >= Math.abs(dy) * 1.25 &&
            (Math.abs(dx) >= surface.clientWidth * .25 || (Math.abs(dx) >= 48 && speed >= 700));
          if (drag.active) suppressZoomUntil = Date.now() + 400;
          drag = null;
          if (shouldChoose) choose(dx < 0 ? "left" : "right");
          else {
            surface.classList.remove("dragging");
            surface.style.transform = "";
            document.getElementById("stampLeft").style.opacity = 0;
            document.getElementById("stampRight").style.opacity = 0;
          }
        }
        surface.addEventListener("pointerup", finish);
        surface.addEventListener("pointercancel", function () {
          drag = null; surface.classList.remove("dragging"); surface.style.transform = "";
        });
      }
      function attachZoom() {
        var viewport = document.getElementById("zoomViewport");
        if (!viewport) return;
        var points = new Map(), lastMid = null, lastDistance = null;
        viewport.addEventListener("pointerdown", function (e) {
          points.set(e.pointerId, { x: e.clientX, y: e.clientY });
          viewport.setPointerCapture(e.pointerId);
        });
        viewport.addEventListener("pointermove", function (e) {
          if (!points.has(e.pointerId)) return;
          var prior = points.get(e.pointerId);
          points.set(e.pointerId, { x: e.clientX, y: e.clientY });
          var arr = Array.from(points.values());
          if (arr.length === 1 && zoomScale > 1) { zoomX += e.clientX - prior.x; zoomY += e.clientY - prior.y; }
          if (arr.length >= 2) {
            var dx = arr[0].x - arr[1].x, dy = arr[0].y - arr[1].y;
            var dist = Math.hypot(dx, dy);
            var mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
            if (lastDistance) zoomScale = Math.max(1, Math.min(4, zoomScale * dist / lastDistance));
            if (lastMid) { zoomX += mid.x - lastMid.x; zoomY += mid.y - lastMid.y; }
            lastDistance = dist; lastMid = mid;
          }
          if (zoomScale === 1) { zoomX = 0; zoomY = 0; }
          updateZoom();
        });
        function release(e) { points.delete(e.pointerId); lastDistance = null; lastMid = null; }
        viewport.addEventListener("pointerup", release);
        viewport.addEventListener("pointercancel", release);
        viewport.addEventListener("wheel", function (e) {
          e.preventDefault();
          zoomScale = Math.max(1, Math.min(4, zoomScale + (e.deltaY < 0 ? .2 : -.2)));
          if (zoomScale === 1) { zoomX = 0; zoomY = 0; }
          updateZoom();
        }, { passive: false });
        updateZoom();
      }
      app.addEventListener("click", function (e) {
        if (choiceLocked) return;
        var target = e.target.closest("[data-action]");
        if (!target) return;
        var action = target.dataset.action;
        if (action === "zoom" && Date.now() < suppressZoomUntil) return;
        if (action === "setup-language") { state.language = target.dataset.lang; save(); render(); }
        else if (action === "confirm-language") { state.languageChosen = true; save(); screen = state.onboarded ? "home" : "onboarding"; render(); }
        else if (action === "language-menu") { languageMenuOpen = true; render(); }
        else if (action === "language-close") { languageMenuOpen = false; render(); }
        else if (action === "switch-language") { state.language = target.dataset.lang; languageMenuOpen = false; save(); render(); }
        else if (action === "nav-home") { screen = "home"; render(); }
        else if (action === "nav-review") { screen = "review"; render(); }
        else if (action === "settings") { settingsReturn = screen; screen = "settings"; render(); }
        else if (action === "settings-back") { screen = settingsReturn; render(); }
        else if (action === "category") { state.selectedCategory = target.dataset.category; save(); render(); }
        else if (action === "category-all") { state.selectedCategory = "all"; save(); render(); }
        else if (action === "start-learn") askStart("learn");
        else if (action === "start-review") askStart("review");
        else if (action === "resume") { screen = state.activeSession && state.activeSession.phase === "results_pending" ? "summary" : "study"; render(); }
        else if (action === "pause") { screen = state.activeSession && state.activeSession.mode === "review" ? "review" : "home"; render(); }
        else if (action === "reveal") { if (state.activeSession) { state.activeSession.revealed = true; save(); render(); } }
        else if (action === "choose-left") choose("left");
        else if (action === "choose-right") choose("right");
        else if (action === "undo") undo();
        else if (action === "detail") { detailId = target.dataset.id; detailRevealed = false; screen = "detail"; render(); }
        else if (action === "detail-back") { screen = "review"; render(); }
        else if (action === "detail-reveal") { detailRevealed = true; render(); }
        else if (action === "zoom") openZoom(target.dataset.id);
        else if (action === "zoom-close") closeZoom();
        else if (action === "zoom-in" || action === "zoom-out") {
          zoomScale = Math.max(1, Math.min(4, zoomScale + (action === "zoom-in" ? .35 : -.35)));
          if (zoomScale === 1) { zoomX = 0; zoomY = 0; }
          updateZoom();
        }
        else if (action === "onboard-next") { onboardStep = 1; render(); }
        else if (action === "onboard-skip" || action === "onboard-done") completeOnboarding();
        else if (action === "how") { onboardReturn = "settings"; onboardStep = 0; screen = "onboarding"; render(); }
        else if (action === "reset") {
          modal = { title: t("resetTitle"), body: t("resetBody"), confirm: t("resetProgress"), danger: true,
            onConfirm: function () {
              var onboarded = state.onboarded, language = state.language, languageChosen = state.languageChosen;
              state = freshState(); state.onboarded = onboarded; state.language = language; state.languageChosen = languageChosen;
              save(); screen = "home"; render();
            } };
          render();
        }
        else if (action === "about") {
          modal = { title: t("aboutTitle"), body: t("aboutBody"), cancel: t("close"), confirm: t("gotIt"), onConfirm: function () {} };
          render();
        }
        else if (action === "modal-cancel") { modal = null; render(); }
        else if (action === "modal-confirm") { var run = modal && modal.onConfirm; modal = null; if (run) run(); else render(); }
        else if (action === "summary-review") leaveSummary("review-session");
        else if (action === "summary-more") leaveSummary("learn-session");
        else if (action === "summary-home") leaveSummary(state.activeSession && state.activeSession.mode === "review" ? "review" : "home");
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (zoomCard) closeZoom();
          else if (languageMenuOpen) { languageMenuOpen = false; render(); }
          else if (modal) { modal = null; render(); }
          else if (screen === "study") { screen = state.activeSession && state.activeSession.mode === "review" ? "review" : "home"; render(); }
          else if (screen === "summary") leaveSummary(state.activeSession && state.activeSession.mode === "review" ? "review" : "home");
          else if (screen === "detail") { screen = "review"; render(); }
          else if (screen === "settings") { screen = settingsReturn; render(); }
          return;
        }
        if (modal || languageMenuOpen || zoomCard || screen !== "study") return;
        if (e.key === "ArrowLeft") { e.preventDefault(); choose("left"); }
        else if (e.key === "ArrowRight") { e.preventDefault(); choose("right"); }
        else if (e.code === "Space" && !state.activeSession.revealed) { e.preventDefault(); state.activeSession.revealed = true; save(); render(); }
      });
      document.addEventListener("error", function (e) {
        if (e.target && e.target.tagName === "IMG") {
          var wrap = e.target.closest(".photo-btn");
          if (wrap) { wrap.classList.add("broken"); wrap.disabled = true; }
        }
      }, true);
      render();
    })();
  </script>
</body>
</html>
