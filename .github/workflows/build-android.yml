name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "data/**"
      - "mobile/**"
      - "scripts/**"
      - "ax.css"
      - "ax.js"
      - "community.mjs"
      - "database.mjs"
      - "discovery.mjs"
      - "package.json"
      - "recognition.mjs"
      - "server.mjs"
      - "support.mjs"
      - "web-bridge.js"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install JavaScript dependencies
        run: npm install
      - name: Download offline OCR assets
        run: npm run assets:ocr
      - name: Allow the Gradle wrapper to run
        run: chmod +x android/gradlew
      - name: Build latest debug APK
        env:
          SIGN_PUBLIC_API_BASE: http://203.241.129.163:4173
        run: npm run android:apk
      - name: Record APK checksum
        run: sha256sum SignBySign-Android.apk > SignBySign-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SignBySign-Android-latest
          path: |
            SignBySign-Android.apk
            SignBySign-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14
