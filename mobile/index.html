<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="description" content="한국어 간판을 촬영해 장소·가게명, 업종, 쉬운 설명과 여행 한국어를 확인하세요.">
  <title>Sign by Sign</title>
  <link rel="stylesheet" href="./ax.css">
  <script>
    window.SIGN_BY_SIGN_MODE = "mobile";
    const packagedApiBase = "__SIGN_PUBLIC_API_BASE__";
    const fallbackApiBase = "http://203.241.129.163:4173";
    const apiBase = (localStorage.getItem("sign-by-sign-api-base") || (packagedApiBase.startsWith("http") ? packagedApiBase : fallbackApiBase)).replace(/\/$/, "");
    window.SignBySignConfig = {
      apiBaseUrl: apiBase,
      communityCatalogUrl: apiBase + "/api/community",
      communitySubmitUrl: apiBase + "/api/community/contributions",
      communityVoteUrl: apiBase + "/api/community/contributions",
      discoveryUrl: apiBase + "/api/discover",
      supportUrl: apiBase + "/api/support"
    };
  </script>
  <script src="./native-bridge.js" defer></script>
  <script src="./vendor/tesseract/tesseract.min.js" defer></script>
  <script src="./ax.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#pageContent">본문으로 이동 · Skip to content</a>
  <main id="app" data-feature="travel-sign-scanner" aria-label="Sign by Sign">
    <div class="startup-error" role="status"><span class="brand-mark">ㅅ</span><h1>오프라인 간판 AI를 준비하고 있어요.</h1><p>Preparing on-device sign intelligence…</p></div>
  </main>
  <input id="captureInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="uploadInput" type="file" accept="image/*" hidden>
  <noscript>간판 학습과 카메라 기능을 이용하려면 JavaScript를 켜주세요.</noscript>
</body>
</html>
