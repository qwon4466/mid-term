<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="description" content="한국어 간판을 사진으로 익히고, 직접 촬영해 업종과 브랜드의 뜻을 확인하세요.">
  <title>Sign by Sign — 간판으로 도시 읽기</title>

<body>
  <a class="skip-link" href="#pageContent">본문으로 이동 · Skip to content</a>
